name: Release desktop builds

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            arch: x64
            runner: windows-latest
          - rid: win-x86
            arch: x86
            runner: windows-latest
          - rid: win-arm64
            arch: arm64
            runner: windows-latest
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-latest
          - rid: osx-x64
            runner: macos-14
          - rid: osx-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}-${{ matrix.rid }}
          restore-keys: |
            ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}-
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Romodoro.sln -r ${{ matrix.rid }}

      - name: Publish Windows framework-dependent build
        if: runner.os == 'Windows'
        run: >-
          dotnet publish src/Romodoro/Romodoro.csproj
          --configuration Release
          --no-restore
          --runtime ${{ matrix.rid }}
          --self-contained false
          -p:DebugType=None
          --output publish/${{ matrix.rid }}

      - name: Publish self-contained Unix build
        if: runner.os != 'Windows'
        run: >-
          dotnet publish src/Romodoro/Romodoro.csproj
          --configuration Release
          --no-restore
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          --output publish/${{ matrix.rid }}

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Resolve .NET runtime prerequisite
        if: runner.os == 'Windows'
        id: runtime
        shell: pwsh
        run: ./build/Resolve-DotNetRuntime.ps1 -Architecture '${{ matrix.arch }}'

      - name: Compile Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_name }}
          RUNTIME_VERSION: ${{ steps.runtime.outputs.runtime_version }}
          RUNTIME_URL: ${{ steps.runtime.outputs.runtime_url }}
          RUNTIME_SHA256: ${{ steps.runtime.outputs.runtime_sha256 }}
        run: |
          $version = $env:VERSION.TrimStart('v')
          $publish = (Resolve-Path "publish/$env:RID").Path
          $output = (Resolve-Path .).Path + "\installer-output\$env:RID"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" `
            "/DRuntimeArchitecture=$env:ARCH" `
            "/DRuntimeVersion=$env:RUNTIME_VERSION" `
            "/DRuntimeUrl=$env:RUNTIME_URL" `
            "/DRuntimeSha256=$env:RUNTIME_SHA256" `
            "/DPublishDir=$publish" `
            "/DOutputDir=$output" `
            installer/Romodoro.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Verify Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: |
          ./installer/tests/Verify-Installer.ps1 `
            -IsccPath "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" `
            -PublishDir "publish/$env:RID" `
            -OutputDir "installer-validation/$env:RID"

      - name: Package Windows installer and checksum
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: |
          $installer = Get-ChildItem "installer-output/$env:RID/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No Windows installer was produced for $env:RID" }
          (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + "  $($installer.Name)" | Set-Content "$($installer.FullName).sha256"

      - name: Package Unix build and checksum
        if: runner.os != 'Windows'
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: |
          $archive = "Romodoro-$env:RID.zip"
          Compress-Archive -Path "publish/$env:RID/*" -DestinationPath $archive -Force
          (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() + "  $archive" | Set-Content "$archive.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Romodoro-${{ matrix.rid }}
          path: ${{ runner.os == 'Windows' && format('installer-output/{0}/*', matrix.rid) || format('Romodoro-{0}.zip*', matrix.rid) }}

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: Romodoro-*
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:TAG_NAME.TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^## \[$([regex]::Escape($version))\]") { $start = $i; break }
          }
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $version" }
          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## \[') { $end = $i; break }
          }
          $lines[$start..($end - 1)] | Set-Content release-notes.md

      - name: Generate WinGet manifest bundle
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:TAG_NAME.TrimStart('v')
          $x86 = (Get-ChildItem release-assets -Filter 'Romodoro-win-x86-setup.exe' -Recurse | Select-Object -First 1).FullName
          $x64 = (Get-ChildItem release-assets -Filter 'Romodoro-win-x64-setup.exe' -Recurse | Select-Object -First 1).FullName
          $arm64 = (Get-ChildItem release-assets -Filter 'Romodoro-win-arm64-setup.exe' -Recurse | Select-Object -First 1).FullName
          if (-not $x86 -or -not $x64 -or -not $arm64) { throw 'Windows installers are required to generate WinGet manifests.' }
          ./build/New-WinGetManifest.ps1 -Version $version -InstallerX86Path $x86 -InstallerX64Path $x64 -InstallerArm64Path $arm64 -OutputDirectory winget-manifest
          Compress-Archive -Path 'winget-manifest/*' -DestinationPath "Romodoro-$version-winget.zip" -Force
          $hash = (Get-FileHash "Romodoro-$version-winget.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Romodoro-$version-winget.zip" | Set-Content "Romodoro-$version-winget.zip.sha256"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Romodoro ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release-assets/*
            Romodoro-*-winget.zip
            Romodoro-*-winget.zip.sha256
          generate_release_notes: false
