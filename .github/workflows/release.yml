name: Release desktop builds

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: win-x86
            runner: windows-latest
          - rid: win-arm64
            runner: windows-latest
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-latest
          - rid: osx-x64
            runner: macos-13
          - rid: osx-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Romodoro.sln -r ${{ matrix.rid }}

      - name: Publish self-contained single file
        run: >-
          dotnet publish src/Romodoro/Romodoro.csproj
          --configuration Release
          --no-restore
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          --output publish/${{ matrix.rid }}

      - name: Package and checksum
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: |
          $archive = "Romodoro-$env:RID.zip"
          Compress-Archive -Path "publish/$env:RID/*" -DestinationPath $archive -Force
          (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() + "  $archive" | Set-Content "$archive.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Romodoro-${{ matrix.rid }}
          path: |
            Romodoro-${{ matrix.rid }}.zip
            Romodoro-${{ matrix.rid }}.zip.sha256

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: Romodoro-*
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:TAG_NAME.TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^## \[$([regex]::Escape($version))\]") { $start = $i; break }
          }
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $version" }
          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## \[') { $end = $i; break }
          }
          $lines[$start..($end - 1)] | Set-Content release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Romodoro ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-assets/*
          generate_release_notes: false
